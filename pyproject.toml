[project]
name = "ithilien-theme"
version = "0.1.0"
description = "Palette audits and theme generators for Ithilien"
requires-python = ">=3.12"
dependencies = [
  "tintprobe==0.1.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "debugpy==1.8.21",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
tintprobe = { git = "https://github.com/achandran/tintprobe", rev = "17797b0225105b90344a6f75f95f61c059a301e8" }
