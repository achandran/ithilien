[project]
name = "ithilien-theme"
version = "0.1.0"
description = "Palette audits and theme generators for Ithilien"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "tintprobe==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["evaluation", ".*", "__pycache__"]
addopts = "-ra"

[tool.uv.sources]
tintprobe = { git = "https://github.com/achandran/tintprobe", rev = "51f79a8b13528d0e1603e880174efa8c77776996" }
