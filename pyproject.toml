[project]
name = "ithilien-theme"
version = "0.1.0"
description = "Palette audits and theme generators for Ithilien"
requires-python = ">=3.12"
dependencies = [
  "coloraide>=8.10,<9",
  "pillow>=11,<13",
  "pynvim>=0.6.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "debugpy==1.8.21",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
