<text x="321" y="229" fill="#34382F" >(attempt </text>
<text x="402" y="229" fill="#64602F" >+ </text>
<text x="420" y="229" fill="#795B28" >1</text>
<text x="429" y="229" fill="#34382F" >))</text>
