<text x="312" y="181" fill="#34382F" >(url, { cache: </text>
<text x="447" y="181" fill="#456344" >&quot;no-store&quot;</text>
<text x="537" y="181" fill="#34382F" > })</text>
<text x="24" y="205" fill="#34382F" >    </text>
<text x="60" y="205" fill="#88483E" font-weight="700">if </text>
