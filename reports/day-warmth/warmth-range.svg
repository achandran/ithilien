<text x="456" y="133" fill="#34382F" >) {</text>
<text x="24" y="157" fill="#34382F" >  </text>
<text x="42" y="157" fill="#88483E" font-weight="700">for </text>
<text x="78" y="157" fill="#34382F" >(</text>
<text x="87" y="157" fill="#88483E" font-weight="700">let </text>
<text x="123" y="157" fill="#34382F" >attempt = </text>
<text x="213" y="157" fill="#795B28" >0</text>
<text x="222" y="157" fill="#34382F" >; attempt </text>
<text x="312" y="157" fill="#64602F" >&lt; </text>
