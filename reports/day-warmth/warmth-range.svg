<text x="240" y="205" fill="#64602F" >=== </text>
<text x="276" y="205" fill="#795B28" >429</text>
<text x="303" y="205" fill="#34382F" >) {</text>
<text x="24" y="229" fill="#34382F" >      </text>
<text x="78" y="229" fill="#88483E" font-weight="700">await </text>
<text x="132" y="229" fill="#5C4619" >sleep</text>
