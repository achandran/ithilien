<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="930" viewBox="0 0 1000 930">
<style>text{font-family:"Berkeley Mono",monospace;font-size:15px}</style>
<rect x="0" y="0" width="1000" height="310" fill="#EEECE1"/>
<text x="20" y="27" fill="#000000" font-weight="700">Black / Current ivory #EEECE1 / 17.72:1</text>
<text x="24" y="62" fill="#000000" font-style="italic">// Resolve retries without hiding partial failures.</text>
<text x="24" y="86" fill="#000000" font-weight="700">export type </text>
<text x="132" y="86" fill="#000000" >RetryPolicy</text>
<text x="231" y="86" fill="#000000" > = { limit: </text>
<text x="339" y="86" fill="#000000" >number</text>
<text x="393" y="86" fill="#000000" >; delay: </text>
<text x="474" y="86" fill="#000000" >number</text>
<text x="528" y="86" fill="#000000" > }</text>
<text x="24" y="110" fill="#000000" font-weight="700">const </text>
<text x="78" y="110" fill="#000000" >policy: </text>
<text x="150" y="110" fill="#000000" >RetryPolicy</text>
<text x="249" y="110" fill="#000000" > = { limit: </text>
<text x="357" y="110" fill="#000000" >3</text>
<text x="366" y="110" fill="#000000" >, delay: </text>
<text x="447" y="110" fill="#000000" >250</text>
<text x="474" y="110" fill="#000000" > }</text>
<text x="24" y="134" fill="#000000" font-weight="700">export async function </text>
<text x="222" y="134" fill="#000000" >fetchWithRetry</text>
<text x="348" y="134" fill="#000000" >(url: </text>
<text x="402" y="134" fill="#000000" >string</text>
<text x="456" y="134" fill="#000000" >) {</text>
<text x="24" y="158" fill="#000000" >  </text>
<text x="42" y="158" fill="#000000" font-weight="700">for </text>
<text x="78" y="158" fill="#000000" >(</text>
<text x="87" y="158" fill="#000000" font-weight="700">let </text>
<text x="123" y="158" fill="#000000" >attempt = </text>
<text x="213" y="158" fill="#000000" >0</text>
<text x="222" y="158" fill="#000000" >; attempt </text>
<text x="312" y="158" fill="#000000" >&lt; </text>
<text x="330" y="158" fill="#000000" >policy.limit; attempt</text>
<text x="519" y="158" fill="#000000" >++</text>
<text x="537" y="158" fill="#000000" >) {</text>
<text x="24" y="182" fill="#000000" >    </text>
<text x="60" y="182" fill="#000000" font-weight="700">const </text>
<text x="114" y="182" fill="#000000" >response = </text>
<text x="213" y="182" fill="#000000" font-weight="700">await </text>
<text x="267" y="182" fill="#000000" >fetch</text>
<text x="312" y="182" fill="#000000" >(url, { cache: </text>
<text x="447" y="182" fill="#000000" >&quot;no-store&quot;</text>
<text x="537" y="182" fill="#000000" > })</text>
<text x="24" y="206" fill="#000000" >    </text>
<text x="60" y="206" fill="#000000" font-weight="700">if </text>
<text x="87" y="206" fill="#000000" >(response.status </text>
<text x="240" y="206" fill="#000000" >=== </text>
<text x="276" y="206" fill="#000000" >429</text>
<text x="303" y="206" fill="#000000" >) {</text>
<text x="24" y="230" fill="#000000" >      </text>
<text x="78" y="230" fill="#000000" font-weight="700">await </text>
<text x="132" y="230" fill="#000000" >sleep</text>
<text x="177" y="230" fill="#000000" >(policy.delay </text>
<text x="303" y="230" fill="#000000" >* </text>
<text x="321" y="230" fill="#000000" >(attempt </text>
<text x="402" y="230" fill="#000000" >+ </text>
<text x="420" y="230" fill="#000000" >1</text>
<text x="429" y="230" fill="#000000" >))</text>
<text x="24" y="254" fill="#000000" >      </text>
<text x="78" y="254" fill="#000000" font-weight="700">continue</text>
<text x="24" y="293" fill="#000000" >Every glyph is black; keyword weight and comment italics remain.</text>
