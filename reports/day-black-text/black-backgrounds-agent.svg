<rect x="186" y="461" width="9" height="28" fill="#A1BA77"/>
<text x="186" y="480" fill="#000000" font-weight="700">3</text>
<rect x="186" y="485" width="9" height="1" fill="#000000"/>
<rect x="16" y="489" width="728" height="28" fill="#E8D3CD"/>
<text x="24" y="508" fill="#000000" >- if (attempt &lt; limit) {</text>
<rect x="16" y="517" width="728" height="28" fill="#B2CCA4"/>
<text x="24" y="536" fill="#000000" >+ if (attempt &lt;= limit) {</text>
<rect x="159" y="517" width="9" height="28" fill="#A1BA77"/>
<text x="159" y="536" fill="#000000" font-weight="700">=</text>
<rect x="159" y="541" width="9" height="1" fill="#000000"/>
<rect x="16" y="545" width="728" height="28" fill="#F2E8C9"/>
<text x="24" y="564" fill="#000000" >~ const retries = 3</text>
<rect x="186" y="545" width="9" height="28" fill="#B17232"/>
<text x="186" y="564" fill="#000000" font-weight="700">3</text>
<rect x="16" y="573" width="728" height="28" fill="#F2E8C9"/>
<text x="24" y="592" fill="#000000" >~ if (attempt &lt;= limit) {</text>
<rect x="159" y="573" width="9" height="28" fill="#B17232"/>
<text x="159" y="592" fill="#000000" font-weight="700">=</text>
<rect x="16" y="601" width="728" height="28" fill="#F2E8C9"/>
<text x="24" y="620" fill="#000000" >~ return items.map( item =&gt; item.id)</text>
<rect x="195" y="601" width="9" height="28" fill="#B17232"/>
<text x="195" y="620" fill="#000000" font-weight="700">·</text>
<text x="24" y="663" fill="#000000" font-style="italic">The visible dot denotes an inserted space in this specimen.</text>
<rect x="16" y="688" width="728" height="121" fill="#E2E1D7"/>
<text x="28" y="714" fill="#000000" >$ python -m unittest tests.test_retry</text>
<text x="28" y="739" fill="#000000" >PASS  retry budget and boundary cases</text>
<text x="28" y="764" fill="#000000" >WARN  network timeout still uses the existing default</text>
<text x="28" y="789" fill="#000000" >Completed in 0.42s / 2 files reviewed</text>
<text x="24" y="852" fill="#000000" >The error wording is unchanged. The tests cover the new</text>
<text x="24" y="876" fill="#000000" >boundary and retry count; network behavior needs a live run.</text>
