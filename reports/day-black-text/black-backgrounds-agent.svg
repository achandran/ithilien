<text x="28" y="87" fill="#000000" font-weight="700">You</text>
<text x="28" y="113" fill="#000000" >Increase the retry budget, fix the boundary check,</text>
<text x="28" y="136" fill="#000000" >and preserve the existing error message.</text>
<text x="24" y="196" fill="#000000" >I found two changes in retry.ts. The request retries up to</text>
<text x="24" y="220" fill="#000000" >three times. A strict comparison excludes the upper bound,</text>
<text x="24" y="244" fill="#000000" >so I will include it and keep partial failures visible.</text>
<text x="24" y="268" fill="#000000" ></text>
<text x="24" y="292" fill="#000000" >The patch below changes one digit and one operator.</text>
<text x="24" y="316" fill="#000000" >The markers identify the line state; the small highlighted</text>
<text x="24" y="340" fill="#000000" >cells identify exactly which characters changed.</text>
